name: mandacaru_wiiu
on:
  # DESATIVADO TEMPORARIAMENTE enquanto o Frame Generation esta em
  # desenvolvimento, pra nao gastar minutos de CI compilando o APK
  # inteiro a cada push. Use o workflow "framegen_test.yml" (novo,
  # ao lado deste arquivo) pra testes rapidos so da parte de frame gen.
  # Para reativar o build automatico: descomente o bloco "push:" abaixo.
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - "*.md"
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        required: false
        type: string
      version_minor:
        description: Version minor
        required: false
        type: string

env:
  VCPKG_ROOT: "${{github.workspace}}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  deploy:
    name: Build APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # nao publica mais Release, so le o codigo
      packages: write  # necessario para o cache binario do vcpkg (NuGet no GitHub Packages)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Restore execute permissions on scripts
        run: |
          # O download do código como zip (em vez de git clone) derruba a
          # permissão de execução de scripts. Restaura em todo arquivo que
          # comece com "#!" (shebang), em qualquer lugar do repositório
          # (inclui dependencies/vcpkg/ports/*, gradlew, etc.).
          find . -type f ! -path "./.git/*" -exec sh -c '
            head -c 2 "$1" 2>/dev/null | grep -q "^#!" && chmod +x "$1"
          ' _ {} \;

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete autoconf autoconf-archive automake libtool

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            echo $mo_file
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Setup vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set version dependent vars
        run: |
          MAJOR="${{ inputs.version_major }}"
          MINOR="${{ inputs.version_minor }}"
          if [ -z "$MAJOR" ]; then MAJOR="0"; fi
          if [ -z "$MINOR" ]; then MINOR="${{ github.run_number }}"; fi
          echo "CEMU_VERSION_MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "CEMU_VERSION_MINOR=$MINOR" >> $GITHUB_ENV
          echo "CEMU_VERSION=$MAJOR.$MINOR" >> $GITHUB_ENV

      - name: Build Cemu
        env:
          ANDROID_STORE_FILE_BASE64: ${{ secrets.ANDROID_STORE_FILE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EMULATOR_VERSION_MAJOR: ${{ env.CEMU_VERSION_MAJOR }}
          EMULATOR_VERSION_MINOR: ${{ env.CEMU_VERSION_MINOR }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64

          cd ./src/android
          chmod +x ./gradlew

          if [[ -n "$ANDROID_STORE_FILE_BASE64" ]]; then
            base64 --decode <<< "${ANDROID_STORE_FILE_BASE64}" > store.jks
            export ANDROID_STORE_FILE=$(pwd)/store.jks
            echo "Android signing store file has been set up."
          else
            echo "No Android signing store file provided. The APK will not be signed with a release key."
          fi

          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          VERSION=${{ env.CEMU_VERSION }}
          mkdir upload
          mv ./src/android/app/build/outputs/apk/*/*.apk upload/Cemu-$VERSION.apk

      # O APK aparece na secao "Artefatos" no fim da pagina da execucao (Actions > execucao > Artefatos).
      # NAO cria Release nem tag. O GitHub entrega artefatos dentro de um .zip: baixe, extraia e instale o .apk.
      - name: Upload APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-${{ env.CEMU_VERSION }}-apk
          path: upload/Cemu-${{ env.CEMU_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
